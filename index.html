<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Clube de Benefícios - Clean & Dry</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#5c2d91] text-white">
  <header class="py-8 text-center">
    <h1 class="text-3xl font-bold">Clube de Benefícios - Clean & Dry</h1>
    <p class="opacity-90">Gerencie os planos do clube</p>
  </header>

  <main class="max-w-3xl mx-auto p-4 space-y-8">
    <!-- Login Admin -->
    <section id="loginAdmin" class="bg-[#4a2474] rounded-xl p-6">
      <h2 class="text-xl font-semibold mb-3">🔒 Acesso Admin</h2>
      <div class="space-y-3">
        <input id="senhaAdmin" type="password" placeholder="Senha do admin"
               class="w-full px-3 py-2 rounded text-black" />
        <button onclick="fazerLogin()" class="w-full bg-white text-[#5c2d91] font-semibold py-2 rounded">
          Entrar
        </button>
      </div>
    </section>

    <!-- Painel Admin -->
    <section id="painelAdmin" class="bg-[#4a2474] rounded-xl p-6 hidden">
      <h2 class="text-xl font-semibold mb-4">⚙️ Painel Administrativo</h2>

      <div class="grid gap-6">
        <div>
          <h3 class="font-semibold mb-2">Plano Essencial</h3>
          <input id="tituloPlanoEssencial" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Título"/>
          <input id="precoPlanoEssencial" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Preço"/>
          <textarea id="descricaoPlanoEssencial" rows="3" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Descrição"></textarea>
          <input id="linkPlanoEssencial" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Link de pagamento"/>
        </div>

        <div>
          <h3 class="font-semibold mb-2">Plano Família</h3>
          <input id="tituloPlanoFamilia" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Título"/>
          <input id="precoPlanoFamilia" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Preço"/>
          <textarea id="descricaoPlanoFamilia" rows="3" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Descrição"></textarea>
          <input id="linkPlanoFamilia" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Link de pagamento"/>
        </div>

        <div>
          <h3 class="font-semibold mb-2">Plano Premium</h3>
          <input id="tituloPlanoPremium" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Título"/>
          <input id="precoPlanoPremium" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Preço"/>
          <textarea id="descricaoPlanoPremium" rows="3" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Descrição"></textarea>
          <input id="linkPlanoPremium" class="w-full px-3 py-2 rounded text-black mb-2" placeholder="Link de pagamento"/>
        </div>
      </div>

      <button onclick="atualizarPlanos()" class="mt-4 w-full bg-white text-[#5c2d91] font-semibold py-2 rounded">
        Atualizar Planos
      </button>
    </section>
  </main>

  <script src="Script.js"></script>
</body>
</html>
